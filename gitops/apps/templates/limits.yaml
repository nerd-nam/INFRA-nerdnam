apiVersion: v1
kind: ResourceQuota
metadata:
  name: nerdnam-quota
  namespace: nerdnam
spec:
  hard: {{ toYaml .Values.quota | nindent 4 }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: nerdnam-defaults
  namespace: nerdnam
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 50m, memory: 64Mi}
      default: {memory: 256Mi}
      max: {memory: 4Gi}
