{{- range list "nerdnam" "data" "monitoring" }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ . }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
{{- end }}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3-retain
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: nerdnam-acme
spec:
  acme:
    email: {{ required "environment.acmeEmail is required" .Values.environment.acmeEmail | quote }}
    server: {{ required "environment.acmeServer is required" .Values.environment.acmeServer | quote }}
    privateKeySecretRef:
      name: nerdnam-acme-account
    solvers:
      - dns01:
          route53:
            hostedZoneID: {{ required "environment.hostedZoneId is required" .Values.environment.hostedZoneId | quote }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: nerdnam-secrets
spec:
  conditions:
    - namespaces: [nerdnam, data, monitoring]
  provider:
    aws:
      service: SecretsManager
      region: {{ required "environment.region is required" .Values.environment.region | quote }}
