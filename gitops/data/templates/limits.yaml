apiVersion: v1
kind: ResourceQuota
metadata:
  name: data-quota
  namespace: data
spec:
  hard: {{ toYaml .Values.quota | nindent 4 }}
---
# requests/limits 를 빠뜨린 컨테이너(후속 exporter 등)에 기본값을 넣어 quota 계산에서 거부되지 않게 한다.
apiVersion: v1
kind: LimitRange
metadata:
  name: data-defaults
  namespace: data
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 50m, memory: 64Mi}
      default: {memory: 128Mi}
      max: {memory: 4Gi}
