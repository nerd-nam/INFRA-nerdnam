{{- $pg := .Values.postgres }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: data
data:
  10-nerdnam-roles.sh: |-
    {{- .Files.Get "files/postgres-init.sh" | nindent 4 }}
---
# StatefulSet 의 Pod DNS 용. 클라이언트는 아래 ClusterIP Service 를 쓴다.
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: data
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: data
spec:
  type: ClusterIP
  selector: {app: postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  serviceName: postgres-headless
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy: {type: RollingUpdate}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
      annotations:
        checksum/init: {{ .Files.Get "files/postgres-init.sh" | sha256sum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ $pg.terminationGracePeriodSeconds }}
      nodeSelector: {{ toYaml .Values.placement.nodeSelector | nindent 8 }}
      tolerations: {{ toYaml .Values.placement.tolerations | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999          # 이미지의 postgres 사용자
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ $pg.image | quote }}
          args:
            - -c
            - listen_addresses=*
            {{- range $key, $value := $pg.parameters }}
            - -c
            - {{ printf "%s=%s" $key $value | quote }}
            {{- end }}
          ports: [{name: postgres, containerPort: 5432}]
          env:
            # EBS 루트에는 lost+found 가 있어 initdb 가 거부하므로 하위 디렉터리를 쓴다.
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - {name: POSTGRES_USER, value: {{ $pg.superuser | quote }}}
            - {name: POSTGRES_INITDB_ARGS, value: "--data-checksums --auth-local=peer --auth-host=scram-sha-256"}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.secretName }}, key: postgres-superuser-password}}
            - {name: NERDNAM_DB, value: {{ $pg.database | quote }}}
            - {name: NERDNAM_MIGRATOR_USER, value: {{ $pg.migratorUser | quote }}}
            - name: NERDNAM_MIGRATOR_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.secretName }}, key: postgres-migrator-password}}
            - {name: NERDNAM_APP_USER, value: {{ $pg.appUser | quote }}}
            - name: NERDNAM_APP_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.secretName }}, key: postgres-app-password}}
            - {name: NERDNAM_EXPORTER_USER, value: {{ .Values.exporters.postgres.user | quote }}}
            - name: NERDNAM_EXPORTER_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.secretName }}, key: postgres-exporter-password}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {{ toYaml $pg.resources | nindent 12 }}
          # pg_isready 는 인증하지 않고 접속 가능 여부만 본다. 초기화 중 임시 서버는 TCP 를 열지 않아 Ready 가 되지 않는다.
          startupProbe:
            exec: {command: [pg_isready, -h, 127.0.0.1, -p, "5432"]}
            periodSeconds: 5
            failureThreshold: 120   # 최대 10분: 초기화·장애 복구(WAL replay)
          readinessProbe:
            exec: {command: [pg_isready, -h, 127.0.0.1, -p, "5432"]}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec: {command: [pg_isready, -h, 127.0.0.1, -p, "5432"]}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          lifecycle:
            # kubelet 의 SIGTERM 은 smart shutdown(모든 연결이 끊길 때까지 대기)이다. 먼저 fast shutdown 을 요청한다.
            # 기다리지 않고(-W) 바로 끝내야 hook 이 컨테이너 종료와 겹쳐 실패로 기록되지 않는다.
            # 이후 SIGTERM 은 이미 진행 중인 fast shutdown 을 늦추지 않고, kubelet 은 grace 안에서 종료를 기다린다.
            preStop:
              exec:
                command: [sh, -c, 'pg_ctl stop -D "$PGDATA" -m fast -W']
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - name: init
          configMap: {name: postgres-init, defaultMode: 0444}
        - name: run
          emptyDir: {sizeLimit: 16Mi}
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: {{ $pg.shmSize }}}
  volumeClaimTemplates:
    # API 가 채우는 apiVersion·kind·volumeMode 를 적어 둔다. 빠지면 Argo 가 늘 OutOfSync 로 본다(2026-10-29 배포에서 확인).
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        volumeMode: Filesystem
        storageClassName: gp3-retain
        resources:
          requests:
            storage: {{ $pg.storage }}
