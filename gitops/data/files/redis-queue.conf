# AI 작업 큐 (ADR-0009). 세션 Redis(redis.conf)와 분리한다: 큐가 밀려도 로그인 세션 쓰기가 실패하지 않게.
bind * -::*
port 6379
protected-mode yes
aclfile /run/redis/users.acl

# 디스크 저장 끔: 요청 본문에 이력 원문이 있다. 재시작하면 메시지가 사라지고, BE 가 같은 id 로 다시 넣는다(BE #66·#67).
appendonly no
save ""
dir /tmp

# 넘쳐도 작업을 지우지 않는다. 꽉 차면 XADD 가 실패하고 BE 가 그 작업을 실패(GPU_UNAVAILABLE)로 끝낸다.
# 처리한 메시지는 처리한 쪽이 XDEL 로 지운다(요청 = AI, 결과 = BE, SPEC #101).
maxmemory {{ .Values.redisQueue.maxmemory }}
maxmemory-policy noeviction

tcp-keepalive 300
timeout 0
loglevel notice
logfile ""
