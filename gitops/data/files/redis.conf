# nerdnam 세션 저장소. 로컬 Compose(인증·영속성 없음)와 다르게 운영한다.
bind * -::*
port 6379
protected-mode yes
aclfile /run/redis/users.acl
dir /data

# 영속성: AOF everysec 를 기본으로, RDB 스냅샷은 AOF 재작성 기반(preamble)으로만 쓴다.
appendonly yes
appendfsync everysec
appenddirname appendonlydir
aof-use-rdb-preamble yes
save ""

# 세션은 지우면 로그인이 풀리므로 꽉 차면 쓰기를 거부한다(지표로 알린다).
maxmemory {{ .Values.redis.maxmemory }}
maxmemory-policy noeviction

tcp-keepalive 300
timeout 0
loglevel notice
logfile ""
