{{- /* 기본 규칙(노드·Pod·PVC 등)은 kube-prometheus-stack 이 넣는다. 여기는 nerdnam 고유 규칙만. */}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nerdnam
  namespace: monitoring
spec:
  groups:
    - name: nerdnam.app
      rules:
        - alert: NerdnamApiDown
          expr: up{namespace="nerdnam", job="api"} == 0
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: BE 지표를 5분 동안 수집하지 못했다
        # 응답 시간 구간(BE #54) 기준. AI 작업은 비동기라 HTTP 응답 시간에 들어가지 않는다. 요청이 거의 없을 때 튀지 않게 초당 0.1건 이상일 때만
        - alert: NerdnamApiLatencyHigh
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{namespace="nerdnam", job="api", uri!~"/actuator.*"}[5m]))) > 3
            and sum(rate(http_server_requests_seconds_count{namespace="nerdnam", job="api", uri!~"/actuator.*"}[5m])) > 0.1
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: BE 응답 시간 p95 가 3초를 넘는 상태가 10분째다 (DB·Redis·노드 자원 확인)
        - alert: NerdnamAiDown
          expr: up{namespace="nerdnam", job="ai"} == 0
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: AI 서버 지표를 5분 동안 수집하지 못했다 (AI Pod·NetworkPolicy 확인)
        # AI #44 지표. 호출이 드물 때 1~2건 실패로 울리지 않게 10분에 5건 이상일 때만
        - alert: NerdnamBedrockErrorsHigh
          expr: |
            sum(rate(nerdnam_ai_bedrock_calls_total{namespace="nerdnam", job="ai", result!="ok"}[10m]))
              / sum(rate(nerdnam_ai_bedrock_calls_total{namespace="nerdnam", job="ai"}[10m])) > 0.2
            and sum(increase(nerdnam_ai_bedrock_calls_total{namespace="nerdnam", job="ai"}[10m])) >= 5
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: Bedrock 호출 실패(throttle·timeout·error)가 20% 를 넘는 상태가 10분째다 (모델 접근 권한·한도·리전 상태 확인)
        - alert: NerdnamBedrockQueueRejected
          expr: sum(increase(nerdnam_ai_bedrock_queue_rejected_total{namespace="nerdnam", job="ai"}[10m])) > 0
          for: 1m
          labels: {severity: warning}
          annotations:
            summary: AI 서버가 최근 10분 안에 대기열이 차서 요청을 503 으로 거절했다 (동시 호출 상한·Bedrock 응답 시간 확인)
        - alert: NerdnamAiJobFailures
          expr: max(nerdnam_aijob_failed_recent) > 3
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: 최근 5분 AI 작업 실패가 3건을 넘는 상태가 10분째다 (Bedrock 한도·AI 서버 상태 확인)
        - alert: NerdnamAiJobQueueBacklog
          expr: max(nerdnam_aijob_queue_size) > 50
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: AI 작업 큐가 50건을 넘게 밀려 있다 (stale-after 20분 전에 처리되지 못할 수 있다)
        # AI 작업 큐(ADR-0009): 큐 대기는 실패로 세지 않으므로, 멈춰도 실패 알림이 오지 않는다. 그래서 "밀린 작업이 한 번도 0이 되지 않고
        # 지금이 기준 시간 전보다 많거나 같음"을 멈춤으로 본다(SPEC #101: 30분, 문서 임베딩 embed-bg 는 60분). AI 가 죽으면 NerdnamAiDown 이 먼저 울린다.
        - alert: NerdnamAiQueueStuck
          expr: |
            (min_over_time(nerdnam_ai_queue_lag{namespace="nerdnam", job="ai", stream!="embed-bg"}[30m]) > 0
              and nerdnam_ai_queue_lag{namespace="nerdnam", job="ai", stream!="embed-bg"} >= nerdnam_ai_queue_lag{namespace="nerdnam", job="ai", stream!="embed-bg"} offset 30m)
            or
            (min_over_time(nerdnam_ai_queue_lag{namespace="nerdnam", job="ai", stream="embed-bg"}[60m]) > 0
              and nerdnam_ai_queue_lag{namespace="nerdnam", job="ai", stream="embed-bg"} >= nerdnam_ai_queue_lag{namespace="nerdnam", job="ai", stream="embed-bg"} offset 60m)
          labels: {severity: warning}
          annotations:
            summary: 'AI 작업 큐({{"{{"}} $labels.stream {{"}}"}})가 줄지 않는다. limiter 대기면 Bedrock 한도, queue 대기만이면 AI 작업자 부족(AI 장애 재현 대시보드)'
        - alert: NerdnamEmbeddingStuck
          expr: max(nerdnam_chunk_pending_oldest_seconds) > 1800
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: 30분 넘게 임베딩을 기다리는 청크가 있다 (검색 근거가 비어 판정이 미충족이 된다)
    - name: nerdnam.data
      rules:
        - alert: NerdnamPostgresDown
          expr: max(pg_up) == 0 or absent(pg_up)
          for: 2m
          labels: {severity: critical}
          annotations:
            summary: PostgreSQL 에 접속할 수 없다
        - alert: NerdnamPostgresConnectionsHigh
          expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: PostgreSQL 연결이 max_connections 의 80% 를 넘었다
        # Redis 는 두 개다: 로그인 세션(job="redis-exporter")과 AI 작업 큐(job="redis-queue-exporter", ADR-0009).
        # 하나만 죽어도 울리게 job 별로 본다. 알림의 job 라벨로 어느 Redis 인지 구분한다.
        - alert: NerdnamRedisDown
          expr: |
            max by (job) (redis_up{namespace="data"}) == 0
            or absent(redis_up{namespace="data", job="redis-exporter"})
            or absent(redis_up{namespace="data", job="redis-queue-exporter"})
          for: 2m
          labels: {severity: critical}
          annotations:
            summary: 'Redis({{"{{"}} $labels.job {{"}}"}}) 에 접속할 수 없다. redis-exporter = 로그인 세션(로그인 실패), redis-queue-exporter = AI 작업 큐(AI 작업 실패)'
        - alert: NerdnamRedisMemoryHigh
          expr: max by (job) (redis_memory_used_bytes{namespace="data"} / redis_memory_max_bytes{namespace="data"}) > 0.8
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: 'Redis({{"{{"}} $labels.job {{"}}"}}) 메모리가 maxmemory 의 80% 를 넘었다. noeviction 이라 꽉 차면 세션 쓰기(로그인) 또는 큐 넣기(AI 작업)가 실패한다'
        - alert: NerdnamRedisRejectingWrites
          expr: sum by (job) (increase(redis_errors_total{namespace="data", err="OOM"}[5m])) > 0
          labels: {severity: critical}
          annotations:
            summary: 'Redis({{"{{"}} $labels.job {{"}}"}}) 가 maxmemory 에 걸려 쓰기를 거부했다'
        # 큐 Redis 는 디스크 저장을 끈다(AOF 없음). 세션 Redis 만 본다.
        - alert: NerdnamRedisAofWriteFailed
          expr: max(redis_aof_last_write_status{namespace="data", job="redis-exporter"}) == 0
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: Redis AOF 쓰기가 실패하고 있다 (세션이 디스크에 남지 않는다)
    - name: nerdnam.logs
      rules:
        - alert: NerdnamLokiDown
          expr: up{namespace="monitoring", job=~"loki.*"} == 0
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: Loki 지표를 10분 동안 수집하지 못했다 (로그가 저장되지 않을 수 있다)
