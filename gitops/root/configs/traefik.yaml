deployment:
  replicas: 1
nodeSelector:
  workload: app
providers:
  kubernetesCRD:
    enabled: false
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: true
ingressClass:
  enabled: true
  name: traefik
  isDefaultClass: false
service:
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-subnets: {{ required "environment.publicSubnetIds is required" .Values.environment.publicSubnetIds | join "," | quote }}
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: TCP
  spec:
    type: LoadBalancer
    loadBalancerClass: service.k8s.aws/nlb
    allocateLoadBalancerNodePorts: false
ports:
  web:
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    http:
      tls:
        enabled: true
accessLog:
  enabled: true
  format: json
  fields:
    headers:
      defaultMode: drop
    queryParameters:
      defaultMode: drop
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
