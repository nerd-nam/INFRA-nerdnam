{{- /* 7단계: Prometheus·Alertmanager·Grafana·operator·kube-state-metrics·node-exporter. 운영 도구는 platform 노드. */}}
{{- $platform := dict "nodeSelector" (dict "workload" "platform") "tolerations" (list (dict "key" "dedicated" "operator" "Equal" "value" "platform" "effect" "NoSchedule")) }}
fullnameOverride: monitoring
cleanPrometheusOperatorObjectNames: true
windowsMonitoring:
  enabled: false
# EKS 관리형 control plane 은 etcd·scheduler·controller-manager 지표를 노드에서 열지 않는다. kube-proxy 는 127.0.0.1 에만 연다.
kubeEtcd: {enabled: false}
kubeScheduler: {enabled: false}
kubeControllerManager: {enabled: false}
kubeProxy: {enabled: false}
defaultRules:
  rules:
    etcd: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeControllerManager: false
    kubeProxy: false
    windows: false

prometheusOperator:
  {{- toYaml $platform | nindent 2 }}
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}
  admissionWebhooks:
    patch:
      {{- toYaml $platform | nindent 6 }}

prometheus:
  prometheusSpec:
    {{- toYaml $platform | nindent 4 }}
    replicas: 1
    retention: 7d
    retentionSize: 20GB       # PVC 30Gi 안에서 WAL·compaction 여유를 남긴다
    # 이 저장소의 ServiceMonitor·PodMonitor·PrometheusRule 을 라벨 없이도 고른다(gitops/observability).
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    # 9단계 부하 시험: k6(load-test namespace)가 결과 지표를 /api/v1/write 로 밀어 넣는다. 클러스터 밖에는 열리지 않는다(ClusterIP).
    enableRemoteWriteReceiver: true
    resources:
      requests: {cpu: 300m, memory: 1536Mi}
      limits: {memory: 3Gi}
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3-retain
          accessModes: [ReadWriteOnce]
          resources:
            requests: {storage: 30Gi}
    externalLabels:
      cluster: {{ required "environment.clusterName is required" .Values.environment.clusterName | quote }}

alertmanager:
  alertmanagerSpec:
    {{- toYaml $platform | nindent 4 }}
    replicas: 1
    retention: 120h
    resources:
      requests: {cpu: 20m, memory: 64Mi}
      limits: {memory: 128Mi}
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3-retain
          accessModes: [ReadWriteOnce]
          resources:
            requests: {storage: 2Gi}
    # Discord 웹훅 URL(ExternalSecret alertmanager-discord). optional: 키가 아직 없어도 Alertmanager 는 뜬다.
    volumes:
      - name: discord-webhook
        secret:
          secretName: alertmanager-discord
          optional: true
    volumeMounts:
      - name: discord-webhook
        mountPath: /etc/alertmanager/discord
        readOnly: true
  # 알림 → Discord 채널(웹훅). URL 은 파일로 읽어 설정·Git 에 남지 않는다(docs/알림-Discord.md).
  # critical·warning 만 보낸다. Watchdog(늘 울리는 생존 신호)·InfoInhibitor·info 는 보내지 않는다.
  config:
    route:
      receiver: discord
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - matchers: [alertname =~ "Watchdog|InfoInhibitor"]
          receiver: "null"
        - matchers: [severity = "info"]
          receiver: "null"
        - matchers: [severity = "critical"]
          receiver: discord
          repeat_interval: 4h
    receivers:
      - name: "null"
      - name: discord
        discord_configs:
          - webhook_url_file: /etc/alertmanager/discord/webhook-url
            send_resolved: true
            title: '{{ "{{" }} template "nerdnam.discord.title" . {{ "}}" }}'
            message: '{{ "{{" }} template "nerdnam.discord.message" . {{ "}}" }}'
    templates:
      - /etc/alertmanager/config/*.tmpl
  templateFiles:
    discord.tmpl: |-
      {{"{{"}} define "nerdnam.discord.title" {{"}}"}}[{{"{{"}} if eq .Status "firing" {{"}}"}}발생 {{"{{"}} .Alerts.Firing | len {{"}}"}}건{{"{{"}} else {{"}}"}}해결{{"{{"}} end {{"}}"}}] {{"{{"}} .CommonLabels.alertname {{"}}"}}{{"{{"}} with .CommonLabels.severity {{"}}"}} · {{"{{"}} . {{"}}"}}{{"{{"}} end {{"}}"}}{{"{{"}} end {{"}}"}}
      {{"{{"}} define "nerdnam.discord.message" {{"}}"}}{{"{{"}} range .Alerts {{"}}"}}{{"{{"}} if eq .Status "firing" {{"}}"}}🔴{{"{{"}} else {{"}}"}}🟢{{"{{"}} end {{"}}"}} **{{"{{"}} .Labels.alertname {{"}}"}}**{{"{{"}} with .Labels.namespace {{"}}"}} · `{{"{{"}} . {{"}}"}}`{{"{{"}} end {{"}}"}}{{"{{"}} with .Labels.pod {{"}}"}} · `{{"{{"}} . {{"}}"}}`{{"{{"}} end {{"}}"}}
      {{"{{"}} with .Annotations.summary {{"}}"}}{{"{{"}} . {{"}}"}}{{"{{"}} else {{"}}"}}{{"{{"}} with .Annotations.description {{"}}"}}{{"{{"}} . {{"}}"}}{{"{{"}} end {{"}}"}}{{"{{"}} end {{"}}"}}
      시작 {{"{{"}} .StartsAt.UTC.Format "01-02 15:04" {{"}}"}} UTC{{"{{"}} if eq .Status "resolved" {{"}}"}} · 해결 {{"{{"}} .EndsAt.UTC.Format "01-02 15:04" {{"}}"}} UTC{{"{{"}} end {{"}}"}}
      {{"{{"}} end {{"}}"}}Grafana: https://grafana.nerdnam.click · Alertmanager: kubectl -n monitoring port-forward svc/monitoring-alertmanager 9093{{"{{"}} end {{"}}"}}

grafana:
  fullnameOverride: grafana
  {{- toYaml $platform | nindent 2 }}
  # 관리자 계정은 Secrets Manager nerdnam/dev/monitoring → ExternalSecret monitoring-secrets (gitops/secrets)
  admin:
    existingSecret: monitoring-secrets
    userKey: grafana-admin-user
    passwordKey: grafana-admin-password
  persistence:
    enabled: true
    type: pvc
    storageClassName: gp3-retain
    accessModes: [ReadWriteOnce]
    size: 5Gi
  # 차트 Ingress 는 쓰지 않는다. grafana.<도메인> 공개(관리 IP 만)는 foundation 차트의 admin-ingress 가 맡는다.
  service:
    type: ClusterIP
  ingress:
    enabled: false
  resources:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {memory: 512Mi}
  grafana.ini:
    analytics:
      reporting_enabled: false
      check_for_updates: false
      check_for_plugin_updates: false
    server:
      root_url: https://{{ required "environment.grafanaHostname is required" .Values.environment.grafanaHostname }}
    users:
      allow_sign_up: false
    auth.anonymous:
      enabled: false
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      jsonData:
        maxLines: 1000
        # 8단계: 로그 줄의 trace_id(32자리 16진수)를 눌러 Tempo trace 로 간다. JSON("trace_id":"…")과 key=value 모두 읽는다.
        derivedFields:
          - name: trace_id
            matcherRegex: '(?:trace_id|traceId)"?\s*[:=]\s*"?([0-9a-f]{32})'
            datasourceUid: tempo
            url: '$${__value.raw}'
            urlDisplayLabel: Tempo 에서 보기
    # 8단계: trace 에서 같은 앱(service.name = Loki 의 app 라벨)의 같은 trace_id 로그로 간다.
    - name: Tempo
      uid: tempo
      type: tempo
      access: proxy
      url: http://tempo.monitoring.svc.cluster.local:3200
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          filterByTraceID: true
          spanStartTimeShift: -5m
          spanEndTimeShift: 5m
          tags:
            - {key: service.name, value: app}
        lokiSearch:
          datasourceUid: loki
        nodeGraph:
          enabled: true

kube-state-metrics:
  {{- toYaml $platform | nindent 2 }}
  # 노드 역할(workload=app/platform/data)을 kube_node_labels{label_workload} 로 낸다. 부하 시험 대시보드가 노드를 역할별로 묶는다.
  metricLabelsAllowlist:
    - nodes=[workload]
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}

# node-exporter 는 모든 노드에 하나씩. app/platform/data 의 taint 를 모두 견딘다.
prometheus-node-exporter:
  tolerations:
    - operator: Exists
      effect: NoSchedule
  resources:
    requests: {cpu: 20m, memory: 32Mi}
    limits: {memory: 64Mi}
