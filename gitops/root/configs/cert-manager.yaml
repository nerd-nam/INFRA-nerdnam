crds:
  enabled: true
serviceAccount:
  create: true
  name: cert-manager
nodeSelector: &nodeSelector
  workload: platform
tolerations: &tolerations
  - key: dedicated
    operator: Equal
    value: platform
    effect: NoSchedule
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi
webhook:
  nodeSelector: *nodeSelector
  tolerations: *tolerations
cainjector:
  nodeSelector: *nodeSelector
  tolerations: *tolerations
startupapicheck:
  nodeSelector: *nodeSelector
  tolerations: *tolerations
