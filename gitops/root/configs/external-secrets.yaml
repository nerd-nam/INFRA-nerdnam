installCRDs: true
replicaCount: 1
serviceAccount:
  create: true
  name: external-secrets
nodeSelector: &nodeSelector
  workload: platform
tolerations: &tolerations
  - key: dedicated
    operator: Equal
    value: platform
    effect: NoSchedule
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi
webhook:
  nodeSelector: *nodeSelector
  tolerations: *tolerations
certController:
  nodeSelector: *nodeSelector
  tolerations: *tolerations
