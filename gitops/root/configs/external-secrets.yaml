installCRDs: true
replicaCount: 1
serviceAccount:
  create: true
  name: external-secrets
nodeSelector: &nodeSelector
  workload: platform
tolerations: &tolerations
  - key: dedicated
    operator: Equal
    value: platform
    effect: NoSchedule
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi
# 9단계: 보조 Pod 에도 requests 를 둔다(측정 전 시작값).
webhook:
  nodeSelector: *nodeSelector
  tolerations: *tolerations
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {memory: 128Mi}
certController:
  nodeSelector: *nodeSelector
  tolerations: *tolerations
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {memory: 128Mi}
