{{- range $name, $namespace := dict "backend" "nerdnam" "ai" "nerdnam" "data" "data" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-secrets
  namespace: {{ $namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: nerdnam-secrets
    kind: ClusterSecretStore
  target:
    name: {{ $name }}-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ required (printf "environment.secretArns.%s is required" $name) (index $.Values.environment.secretArns $name) | quote }}
{{- end }}
