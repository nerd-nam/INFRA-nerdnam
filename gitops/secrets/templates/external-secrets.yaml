{{- /*
  data 비밀값(nerdnam/dev/data)이 DB·Redis 인증의 단일 출처다. BE 는 그중 자기에게 필요한 키만
  Spring 환경 변수 이름으로 받는다. 슈퍼유저 비밀번호는 nerdnam namespace 로 넘기지 않는다.
  nerdnam/dev/backend JSON 에는 아래 Spring 키를 넣지 않는다(같은 키가 두 곳에 있으면 어느 값이 쓰일지 헷갈린다).
*/}}
{{- $backendFromData := dict "SPRING_DATASOURCE_PASSWORD" "postgres-app-password" "SPRING_FLYWAY_PASSWORD" "postgres-migrator-password" "SPRING_DATA_REDIS_PASSWORD" "redis-api-password" }}
{{- range $name, $namespace := dict "backend" "nerdnam" "ai" "nerdnam" "data" "data" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-secrets
  namespace: {{ $namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: nerdnam-secrets
    kind: ClusterSecretStore
  target:
    name: {{ $name }}-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ required (printf "environment.secretArns.%s is required" $name) (index $.Values.environment.secretArns $name) | quote }}
  {{- if eq $name "backend" }}
  data:
    {{- range $secretKey, $property := $backendFromData }}
    - secretKey: {{ $secretKey }}
      remoteRef:
        key: {{ required "environment.secretArns.data is required" $.Values.environment.secretArns.data | quote }}
        property: {{ $property }}
    {{- end }}
  {{- end }}
{{- end }}
