# AI 장애 재현 — 공고 분석 몰림(장애형). 정상 분당 2건 5분 → 2분 쉼 → 몰림 분당 5건 5분. 분석 1건 = Titan 임베딩 20번 → 분당 한도에서 실패(gpu_unavailable) 증가 예상
# 실제 Bedrock 을 부른다(요금). 팀에 공지하고, 그동안 문서 업로드·다른 AI 사용을 멈춘다. INFRA #19, SPEC ADR-0008 부록.
#   scripts/load-test.sh run ai-analysis --session --env POSTING_IDS=<공고 id 쉼표 목록>
# 결과: Grafana "nerdnam AI 장애 재현" 대시보드. 절차는 docs/부하-시험-실행.md
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  generateName: ai-analysis-
  namespace: load-test
spec:
  parallelism: 1
  script:
    configMap: {name: k6-scripts, file: ai.js}
  # 결과 지표를 Prometheus 로 보낸다(주소는 k6-env ConfigMap). 요약은 runner 로그에 남는다
  arguments: --out experimental-prometheus-rw
  runner:
    image: grafana/k6:1.3.0@sha256:3ddc8b1a33a2c3d8edc6e99b6a762ae36cba08788463458f5e6a7703e14eb77d
    nodeSelector: &platform {workload: platform}
    tolerations: &tolerate
      - {key: dedicated, operator: Equal, value: platform, effect: NoSchedule}
    resources:
      requests: {cpu: 500m, memory: 512Mi}
      limits: {memory: 1Gi}
    envFrom: &envFrom
      - configMapRef: {name: k6-env}
    env: &env
      # initializer(k6 archive)는 envFrom(시스템 환경 변수)을 스크립트에 넘기지 않는다. 스크립트가 읽는 값은 여기 env 로 직접 준다.
      - name: BASE_URL
        valueFrom:
          configMapKeyRef: {name: k6-env, key: BASE_URL}
      - {name: SCENARIO, value: analysis}
      # 분석이 한 번 끝난 시험 계정 공고 id(BE scripts/loadtest-seed.sh). 실행 때 넣는다: load-test.sh --env POSTING_IDS=3,4,…
      - {name: POSTING_IDS, value: ""}
      # 시험 계정 로그인 쿠키(필수). load-test.sh --session 또는 kubectl -n load-test create secret generic k6-session --from-literal=SESSION=…
      - name: SESSION
        valueFrom:
          secretKeyRef: {name: k6-session, key: SESSION, optional: true}
  # 시작 전에 스크립트를 검사하고 필요한 VU 수를 계산한다. 같은 환경 변수를 봐야 계산이 맞다
  initializer:
    image: grafana/k6:1.3.0@sha256:3ddc8b1a33a2c3d8edc6e99b6a762ae36cba08788463458f5e6a7703e14eb77d
    nodeSelector: *platform
    tolerations: *tolerate
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {memory: 256Mi}
    envFrom: *envFrom
    env: *env
  starter:
    image: ghcr.io/grafana/k6-operator:starter-v1.7.0@sha256:cc530bc90311d11f16549b6ee517d96d3b5f4e8e4ae99a20242edcbdb3f06304
    nodeSelector: *platform
    tolerations: *tolerate
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 64Mi}
