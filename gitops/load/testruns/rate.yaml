# 요청량 변화. 초당 반복 2 → 5 → 10 → 20, 단계마다 1분 올리고 3분 유지(약 17분). 반복 1번 = 요청 3개(로그인 시 8개)
#   kubectl create -f gitops/load/testruns/rate.yaml       (apply 가 아니라 create: 이름 뒤에 매번 새 글자가 붙는다)
#   kubectl -n load-test get testrun                          (stage 가 finished 가 되면 끝)
#   kubectl -n load-test logs -f -l k6_cr=<만든 이름>,runner=true   (k6 요약)
#   kubectl -n load-test delete testrun <만든 이름>            (끝나면 지운다. Pod 도 함께 지워진다)
# 결과는 Grafana "nerdnam 부하 시험" 대시보드에서 서버 지표와 같은 시간축으로 본다. 절차는 docs/부하-시험.md
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  generateName: rate-
  namespace: load-test
spec:
  parallelism: 1
  script:
    configMap: {name: k6-scripts, file: nerdnam.js}
  # 결과 지표를 Prometheus 로 보낸다(주소는 k6-env ConfigMap). 요약은 runner 로그에 남는다
  arguments: --out experimental-prometheus-rw
  runner:
    image: grafana/k6:1.3.0@sha256:3ddc8b1a33a2c3d8edc6e99b6a762ae36cba08788463458f5e6a7703e14eb77d
    nodeSelector: &platform {workload: platform}
    tolerations: &tolerate
      - {key: dedicated, operator: Equal, value: platform, effect: NoSchedule}
    resources:
      requests: {cpu: 500m, memory: 512Mi}
      limits: {memory: 1Gi}
    envFrom: &envFrom
      - configMapRef: {name: k6-env}
    env: &env
      - {name: SCENARIO, value: rate}
      # 목표 초당 반복 수:시간
      - {name: STAGES, value: "2:1m,2:3m,5:1m,5:3m,10:1m,10:3m,20:1m,20:3m,0:1m"}
      - {name: MAX_VUS, value: "300"}
      # 로그인 경로까지: kubectl -n load-test create secret generic k6-session --from-literal=SESSION=<쿠키 값>  (없으면 비로그인 경로만)
      - name: SESSION
        valueFrom:
          secretKeyRef: {name: k6-session, key: SESSION, optional: true}
  # 시작 전에 스크립트를 검사하고 필요한 VU 수를 계산한다. 같은 환경 변수를 봐야 계산이 맞다
  initializer:
    image: grafana/k6:1.3.0@sha256:3ddc8b1a33a2c3d8edc6e99b6a762ae36cba08788463458f5e6a7703e14eb77d
    nodeSelector: *platform
    tolerations: *tolerate
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {memory: 256Mi}
    envFrom: *envFrom
    env: *env
  starter:
    image: ghcr.io/grafana/k6-operator:starter-v1.7.0@sha256:cc530bc90311d11f16549b6ee517d96d3b5f4e8e4ae99a20242edcbdb3f06304
    nodeSelector: *platform
    tolerations: *tolerate
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 64Mi}
